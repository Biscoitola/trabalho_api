worker_processes 1;
events { worker_connections 1024; }

http {
    limit_req_zone $binary_remote_addr zone=por_ip:10m rate=5r/s;
    limit_req_status 429;

    upstream apis {
        zone apis 64k;
        # DNS interno do Docker: atualiza os IPs quando containers são recriados.
        resolver 127.0.0.11 valid=5s ipv6=off;
        server api1:8000 resolve;
        server api2:8000 resolve;
    }

    server {
        listen 80;

        location / {
            limit_req zone=por_ip burst=5 nodelay;
            proxy_pass http://apis;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
